; PlatformIO Project Configuration File
; Video completo de Bad Apple reproducido desde la particion de datos
; (LittleFS) en vez de compilar los frames dentro de la app.
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions_custom.csv
; main.py sube FS + app sin reiniciar la placa en cada upload y hace un
; unico reset al final (via esptool). El chip queda en el bootloader hasta
; que se ejecuta ese reset.
board_upload.after_reset = no_reset
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit SSD1306@^2.5.17